<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Reci</title>
<meta name="description" content="Easy Reci — Hong Kong supermarket discounts, turned into recipes worth cooking.">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f5;
    --text: #1c1c1a;
    --muted: #5f5f58;
    --line: #e3e3dd;
    --accent: #2f7d5d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141513;
      --surface: #1d1f1c;
      --text: #ececE6;
      --muted: #a3a39a;
      --line: #2e302c;
      --accent: #6fc49a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
  }
  .wrap { max-width: 560px; padding: 48px 16px; }
  h1 { font-size: 2rem; margin: 0 0 12px; text-wrap: balance; }
  p { color: var(--muted); }
  .links { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Easy Reci</h1>
  <p>Hong Kong supermarket discounts, turned into recipes worth cooking. Currently in
  private testing.</p>
  <div class="links">
    <p><a href="privacy.html">Privacy Policy</a></p>
  </div>
</div>
</body>
</html>
